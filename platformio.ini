[platformio]
src_dir     = firmware/src
lib_dir     = firmware/lib
test_dir    = firmware/test
include_dir = firmware/include

[env:waveshare-esp32-s3-r32n16]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

; Flash: 32MB Octal SPI (WROOM-2-N32R16V)
board_build.flash_size = 32MB
board_build.flash_mode = opi

; PSRAM: 16MB Octal SPI
board_build.arduino.memory_type = opi_opi

; Upload via CH343 UART. Two USB ports appear: JTAG (upload) and Single Serial (monitor).
; If ports change run `platformio device list` to find new values.
upload_speed  = 921600
monitor_port  = /dev/cu.usbmodem5B610928131 ; must be set — pio defaults to JTAG, not CH343
monitor_speed = 115200

; Partition table: use full 32MB
board_build.partitions = large_littlefs_32MB.csv
board_build.filesystem = littlefs

build_flags =
    -DBOARD_HAS_PSRAM
