<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 252 204" width="252mm" height="204mm">
<!--
  POCKET GROOVEBOX v1.0 — interior layout, 2D top view (one-octave device).
  Coordinate system: 1 user unit = 1 mm (real measures). Page 252 × 204 mm.
  Shell 184 × 120 mm at (34,26), walls 2.4 mm → interior (36.4,28.4)–(215.6,143.6).
  Keyboard: 12 keys C–B, unit 18 mm, gap 0.5 mm, pitch 18.5 mm; plate 131 × 56.75
  at shell-relative (46.6,56.85), 4 mm margins to interior right + bottom walls.
  Edit module positions via each group's coordinates; restyle via the <style> block;
  key caps are reusable <use> of 3 shape defs. Dashed = hidden layers (see NOTES).
  Spec source: hardware/3d/keyboard/octaves-plan.md §8. Editable in Boxy SVG.
-->
  <style>
    text       { font-family: 'Helvetica Neue', Arial, sans-serif; }
    .title     { font-size: 5.5px; font-weight: 700; letter-spacing: .75px; fill: #262626; }
    .lbl       { font-size: 4.25px; font-weight: 700; fill: #333; text-anchor: middle; }
    .sub       { font-size: 3.5px; fill: #5c5c5c; text-anchor: middle; }
    .faint     { font-size: 3.5px; fill: #888; text-anchor: middle; }
    .scr       { font-size: 3px; }
    .klbl      { font-size: 3.5px; fill: #7a7a7a; text-anchor: middle; }
    .klbl-s    { font-size: 3px; fill: #bbb; text-anchor: middle; }
    .dim       { font-size: 4px; fill: #666; text-anchor: middle; }
    .dims      { font-size: 2.8px; fill: #555; text-anchor: middle; }
    .grid-lbl  { font-size: 3.5px; fill: #7c7a70; }

    .wkey  { fill: #f7f4ed; stroke: #666; stroke-width: .4; }
    .bkey  { fill: #141414; stroke: #000; stroke-width: .25; }
    .plate { fill: #b6b2a6; stroke: #8a877c; stroke-width: .5; }
    .body  { fill: none; stroke: #454545; stroke-width: .4; stroke-dasharray: 1.2,.8; }

    /* hidden layers (2D top view can't show depth): */
    .under-plate  { stroke: #d97b2f; stroke-width: .6; stroke-dasharray: 2,1.2; fill: none; }  /* below the key plate */
    .bottom-shell { stroke: #808080; stroke-width: .6; stroke-dasharray: 2,1.2; fill: none; }  /* in the bottom shell */
    .under-lbl    { font-size: 3px; font-weight: 700; fill: #d97b2f; text-anchor: middle; }
    .bottom-lbl   { font-size: 3px; font-weight: 700; fill: #6e6e6e; text-anchor: middle; }

    .dimln  { stroke: #888; stroke-width: .4; fill: none; }
    .dimk   { stroke: #555; stroke-width: .5; fill: none; }
  </style>

  <defs>
    <!-- Technical grid: "+" cross at every 1 cm intersection, dotted gridlines between.
         Offset (4,6) so gridlines fall on the shell edges (34,26)–(218,146). -->
    <pattern id="grid" x="4" y="6" width="10" height="10" patternUnits="userSpaceOnUse">
      <g stroke="#8d8b80" stroke-width="0.28">
        <path d="M -1.25 0 H 1.25 M 0 -1.25 V 1.25"/>
        <path d="M 8.75 0 H 11.25 M 10 -1.25 V 1.25"/>
        <path d="M -1.25 10 H 1.25 M 0 8.75 V 11.25"/>
        <path d="M 8.75 10 H 11.25 M 10 8.75 V 11.25"/>
      </g>
      <g fill="#9a988d" opacity="0.55">
        <circle cx="2.5" cy="0"   r=".35"/><circle cx="5" cy="0"   r=".35"/><circle cx="7.5" cy="0"   r=".35"/>
        <circle cx="2.5" cy="10"  r=".35"/><circle cx="5" cy="10"  r=".35"/><circle cx="7.5" cy="10"  r=".35"/>
        <circle cx="0"   cy="2.5" r=".35"/><circle cx="0" cy="5"   r=".35"/><circle cx="0"   cy="7.5" r=".35"/>
        <circle cx="10"  cy="2.5" r=".35"/><circle cx="10" cy="5"  r=".35"/><circle cx="10"  cy="7.5" r=".35"/>
      </g>
    </pattern>
    <!-- Speaker grille dots -->
    <pattern id="grille" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.1" fill="#454545"/>
    </pattern>
    <!-- Arrow markers (userSpaceOnUse so they stay ~2 mm regardless of stroke) -->
    <marker id="arr"   markerUnits="userSpaceOnUse" markerWidth="2.4" markerHeight="2.4" refX="2"   refY="1.2" orient="auto"><path d="M0,0 L0,2.4 L2.4,1.2 z" fill="#555"/></marker>
    <marker id="arrL"  markerUnits="userSpaceOnUse" markerWidth="2.4" markerHeight="2.4" refX="0.4" refY="1.2" orient="auto"><path d="M2.4,0 L2.4,2.4 L0,1.2 z" fill="#555"/></marker>
    <marker id="arrW"  markerUnits="userSpaceOnUse" markerWidth="2.4" markerHeight="2.4" refX="2"   refY="1.2" orient="auto"><path d="M0,0 L0,2.4 L2.4,1.2 z" fill="#888"/></marker>
    <marker id="arrWL" markerUnits="userSpaceOnUse" markerWidth="2.4" markerHeight="2.4" refX="0.4" refY="1.2" orient="auto"><path d="M2.4,0 L2.4,2.4 L0,1.2 z" fill="#888"/></marker>

    <!-- Reusable OP-1-style flat key caps (local mm, r1.5 corners, drawn at true size so
         the 0.5 mm gaps read between neighbours):
         capN = natural 1u×2u (18×36) · capS15 = sharp 1.5u×1u (27×18) · capS1 = sharp 1u×1u (18×18) -->
    <rect id="capN"   width="18" height="36" rx="1.5"/>
    <rect id="capS15" width="27" height="18" rx="1.5"/>
    <rect id="capS1"  width="18" height="18" rx="1.5"/>

    <clipPath id="shell-clip"><rect x="34" y="26" width="184" height="120" rx="8"/></clipPath>
  </defs>

  <!-- Page + full-canvas grid -->
  <rect width="252" height="204" fill="#f3efe8"/>
  <rect width="252" height="204" fill="url(#grid)"/>

  <text class="title" x="126" y="13" text-anchor="middle">POCKET GROOVEBOX v1.0 — INTERIOR LAYOUT — 184 × 120 mm</text>

  <!-- ═══ SHELL — 184 × 120 mm (46 × 30 units of 4 mm), walls 2.4 mm ═══ -->
  <rect x="34" y="26" width="184" height="120" rx="8" fill="#cdc7ba" stroke="#5f5d54" stroke-width="1"/>
  <rect x="34" y="26" width="184" height="120" fill="url(#grid)" clip-path="url(#shell-clip)" opacity="0.5"/>
  <!-- interior boundary (wall 2.4) -->
  <rect x="36.4" y="28.4" width="179.2" height="115.2" rx="5.6" fill="none" stroke="#a09c90" stroke-width=".3" stroke-dasharray="1,1"/>
  <text class="grid-lbl" x="36.8" y="32.4">grid 1 cm</text>

  <!-- ═══ USB-C — opening in the rear (top) wall, near the right — position TBD ═══ -->
  <g id="usb-c">
    <rect class="bottom-shell" x="197.5" y="25.4" width="9" height="3.6" rx="1.2"/>
    <text class="bottom-lbl" x="202" y="23">USB-C (position TBD)</text>
  </g>

  <!-- ═══ TOP BAND (shell-relative y 6.4 → 52.8, module row centred at y 29.6) ═══ -->

  <!-- ═══ DISPLAY — ST7789 1.9" landscape, PCB 62 × 29, active 42.72 × 22.695 ═══ -->
  <g id="display">
    <rect x="40.4" y="41.1" width="62" height="29" rx="2" fill="#161616" stroke="#3a3a3a" stroke-width=".75"/>
    <rect x="50.04" y="44.25" width="42.72" height="22.7" rx="1" fill="#08182c"/>
    <text class="scr" x="71.4" y="49.7" text-anchor="middle" fill="#4a8cc4" letter-spacing=".5">POCKET GB v1.0</text>
    <line x1="51.5" y1="51.3" x2="90.5" y2="51.3" stroke="#234e74" stroke-width=".25"/>
    <text class="scr" x="57.5" y="56.3" fill="#7ec0ff" font-weight="bold">128</text>
    <text x="57.5" y="60.3" font-size="2.75" fill="#3f86bf" letter-spacing=".5">BPM</text>
    <text class="scr" x="74" y="56.3" fill="#5fb0ec">▶ PLAY</text>
    <text x="74" y="60.8" font-size="3" fill="#3f86bf">C MAJ  vol 7</text>
    <line x1="51.5" y1="62.3" x2="90.5" y2="62.3" stroke="#244e74" stroke-width=".25"/>
    <text x="71.4" y="64.3" font-size="2.75" text-anchor="middle" fill="#2e5a86">patch 001  seq OFF</text>
    <text class="sub" x="71.4" y="74.6">ST7789 1.9" — PCB 62 × 29</text>
    <text class="faint" x="71.4" y="78.6" font-size="3">active 42.7 × 22.7</text>
  </g>

  <!-- ═══ ENCODER 1 — EC11, knob Ø18, body 12 × 12 (dashed) ═══ -->
  <g id="enc1">
    <rect class="body" x="119.5" y="49.6" width="12" height="12"/>
    <circle cx="125.5" cy="55.6" r="9" fill="#6c6c6c" stroke="#3c3c3c" stroke-width=".75"/>
    <circle cx="125.5" cy="55.6" r="6" fill="#525252" stroke="#2e2e2e" stroke-width=".5"/>
    <circle cx="125.5" cy="55.6" r="1.4" fill="#8a8a8a"/>
    <line x1="125.5" y1="55.6" x2="125.5" y2="48.6" stroke="#e2e2e2" stroke-width="1.1" stroke-linecap="round"/>
    <text class="sub" x="125.5" y="69.6">ENC 1 · EC11</text>
    <text class="faint" x="125.5" y="73.6" font-size="3">39/40/16</text>
  </g>

  <!-- ═══ ENCODER 2 — EC11, knob Ø18, body 12 × 12 (dashed) ═══ -->
  <g id="enc2">
    <rect class="body" x="142.5" y="49.6" width="12" height="12"/>
    <circle cx="148.5" cy="55.6" r="9" fill="#6c6c6c" stroke="#3c3c3c" stroke-width=".75"/>
    <circle cx="148.5" cy="55.6" r="6" fill="#525252" stroke="#2e2e2e" stroke-width=".5"/>
    <circle cx="148.5" cy="55.6" r="1.4" fill="#8a8a8a"/>
    <line x1="148.5" y1="55.6" x2="148.5" y2="48.6" stroke="#e2e2e2" stroke-width="1.1" stroke-linecap="round"/>
    <text class="sub" x="148.5" y="69.6">ENC 2 · EC11</text>
    <text class="faint" x="148.5" y="73.6" font-size="3">41/42/17</text>
  </g>

  <!-- ═══ SPEAKER — Ø40 full-range driver + grille ═══ -->
  <g id="speaker">
    <circle cx="191.6" cy="55.6" r="20" fill="#161616" stroke="#3a3a3a" stroke-width=".75"/>
    <circle cx="191.6" cy="55.6" r="17" fill="url(#grille)"/>
    <circle cx="191.6" cy="55.6" r="14"  fill="none" stroke="#383838" stroke-width=".75"/>
    <circle cx="191.6" cy="55.6" r="8.5" fill="none" stroke="#383838" stroke-width=".5"/>
    <circle cx="191.6" cy="55.6" r="3"   fill="none" stroke="#383838" stroke-width=".4"/>
    <text class="sub" x="191.6" y="79.3">SPEAKER Ø40 · 4 Ω</text>
  </g>

  <!-- ═══ PERFBOARD (bottom shell, dashed) — main board: ESP32-S3 + PCM5102 + PAM8403 ═══ -->
  <g id="perfboard">
    <rect class="bottom-shell" x="42" y="35.6" width="100" height="40" rx="2"/>
    <text class="bottom-lbl" x="92" y="39.4">PERFBOARD 100 × 40 (bottom shell · verify) — ESP32-S3 · PCM5102 · PAM8403</text>
  </g>

  <!-- ═══ JOYSTICK — KY-023, board 26 × 34, stick Ø26, zone centre x 24.5 (shell-rel) ═══ -->
  <g id="joystick">
    <rect x="45.5" y="94.2" width="26" height="34" rx="2" fill="#4a4a4a" stroke="#2c2c2c" stroke-width=".75"/>
    <circle cx="58.5" cy="111.2" r="13"  fill="#5c5c5c" stroke="#363636" stroke-width=".5"/>
    <circle cx="58.5" cy="111.2" r="8"   fill="#7e7e7e" stroke="#4e4e4e" stroke-width=".5"/>
    <circle cx="58.5" cy="111.2" r="4"   fill="#a0a0a0" stroke="#6e6e6e" stroke-width=".25"/>
    <line x1="53.5" y1="111.2" x2="63.5" y2="111.2" stroke="#3a3a3a" stroke-width=".6"/>
    <line x1="58.5" y1="106.2" x2="58.5" y2="116.2" stroke="#3a3a3a" stroke-width=".6"/>
    <text class="sub" x="58.5" y="133">JOYSTICK KY-023</text>
    <text class="faint" x="58.5" y="137" font-size="3">26 × 34 (verify) · stick Ø26</text>
  </g>

  <!-- ═══ KEYBOARD — 12 keys C–B, unit 18 mm, gap 0.5, pitch 18.5 ═══
       Plate 131 × 56.75 at shell-rel (46.6,56.85) → abs (80.6,82.85); 4 mm margins to
       the interior right + bottom walls. Naturals 7× 18×36, centres x = 90.6 + i·18.5,
       front row 1 mm off the plate's bottom edge. Sharps behind, row centres 27.75 mm
       up: x = plate centre 146.1 + (x_u − 3.5)·18.5, x_u = 0.75/2.25/3.75/5.0/6.25. -->
  <g id="keyboard">
    <rect class="plate" x="80.6" y="82.85" width="131" height="56.75" rx="3"/>

    <!-- Naturals — 7× 1u×2u (18 × 36), left edge = centre − 9, y 102.6 -->
    <use class="wkey" xlink:href="#capN" x="81.6"  y="102.6"/>
    <use class="wkey" xlink:href="#capN" x="100.1" y="102.6"/>
    <use class="wkey" xlink:href="#capN" x="118.6" y="102.6"/>
    <use class="wkey" xlink:href="#capN" x="137.1" y="102.6"/>
    <use class="wkey" xlink:href="#capN" x="155.6" y="102.6"/>
    <use class="wkey" xlink:href="#capN" x="174.1" y="102.6"/>
    <use class="wkey" xlink:href="#capN" x="192.6" y="102.6"/>

    <!-- Sharps — 4× 1.5u×1u (27 × 18) + G# 1u×1u (18 × 18), y 83.85 -->
    <use class="bkey" xlink:href="#capS15" x="81.725"  y="83.85"/>
    <use class="bkey" xlink:href="#capS15" x="109.475" y="83.85"/>
    <use class="bkey" xlink:href="#capS15" x="137.225" y="83.85"/>
    <use class="bkey" xlink:href="#capS1"  x="164.85"  y="83.85"/>
    <use class="bkey" xlink:href="#capS15" x="183.475" y="83.85"/>

    <!-- Key letters -->
    <text class="klbl" x="90.6"  y="132">C</text>
    <text class="klbl" x="109.1" y="132">D</text>
    <text class="klbl" x="127.6" y="132">E</text>
    <text class="klbl" x="146.1" y="132">F</text>
    <text class="klbl" x="164.6" y="132">G</text>
    <text class="klbl" x="183.1" y="132">A</text>
    <text class="klbl" x="201.6" y="132">B</text>
    <text class="klbl-s" x="95.225"  y="87.8">C#</text>
    <text class="klbl-s" x="122.975" y="87.8">D#</text>
    <text class="klbl-s" x="150.725" y="87.8">F#</text>
    <text class="klbl-s" x="173.85"  y="87.8">G#</text>
    <text class="klbl-s" x="196.975" y="87.8">A#</text>
  </g>

  <!-- ═══ PCF8575 (under plate, dashed) — hangs between the sharps-row bays
       C#↔D# (x 109.1) and D#↔F# (x 136.85) ═══ -->
  <g id="pcf8575">
    <rect class="under-plate" x="101.975" y="84" width="42" height="20" rx="1.5"/>
    <line class="under-plate" x1="109.1"  y1="85" x2="109.1"  y2="103" stroke-width=".35"/>
    <line class="under-plate" x1="136.85" y1="85" x2="136.85" y2="103" stroke-width=".35"/>
    <text class="under-lbl" x="122.975" y="92.6">PCF8575 42 × 20 (verify)</text>
    <text class="under-lbl" x="122.975" y="96.6">under plate · hand-wired</text>
  </g>

  <!-- ═══ DIMENSION ANNOTATIONS — outside the part: verticals → left, horizontals → bottom,
       stepped so labels never overlap ═══ -->

  <!-- Vertical → left margin: top band 46.4 (col x 16) + plate 56.75 (col x 8) -->
  <line class="dimln" x1="34" y1="32.4" x2="14" y2="32.4"/>
  <line class="dimln" x1="34" y1="78.8" x2="14" y2="78.8"/>
  <line class="dimk"  x1="16" y1="32.4" x2="16" y2="78.8" marker-end="url(#arr)" marker-start="url(#arrL)"/>
  <text class="dims" x="12.5" y="55.6" transform="rotate(-90 12.5 55.6)">band 46.4</text>

  <line class="dimln" x1="79.6" y1="82.85" x2="6" y2="82.85"/>
  <line class="dimln" x1="79.6" y1="139.6" x2="6" y2="139.6"/>
  <line class="dimk"  x1="8"  y1="82.85" x2="8" y2="139.6" marker-end="url(#arr)" marker-start="url(#arrL)"/>
  <text class="dims" x="4.5" y="111.2" transform="rotate(-90 4.5 111.2)">plate 56.75</text>

  <!-- Horizontal → bottom, stepped top→bottom -->
  <!-- row 1: joystick zone 44.2 (interior wall → plate) + natural cap 18 (C cap edges) -->
  <line class="dimln" x1="36.4" y1="147" x2="36.4" y2="153"/>
  <line class="dimln" x1="80.6" y1="147" x2="80.6" y2="153"/>
  <line class="dimk"  x1="36.4" y1="152" x2="80.6" y2="152" marker-end="url(#arr)" marker-start="url(#arrL)"/>
  <text class="dims" x="58.5" y="150.6">zone 44.2</text>
  <line class="dimln" x1="81.6" y1="147" x2="81.6" y2="153"/>
  <line class="dimln" x1="99.6" y1="147" x2="99.6" y2="153"/>
  <line class="dimk"  x1="81.6" y1="152" x2="99.6" y2="152" marker-end="url(#arr)" marker-start="url(#arrL)"/>
  <text class="dims" x="90.6" y="150.6">cap 18</text>
  <!-- row 2: pitch 18.5 (D→E centres) -->
  <line class="dimln" x1="109.1" y1="147" x2="109.1" y2="158"/>
  <line class="dimln" x1="127.6" y1="147" x2="127.6" y2="158"/>
  <line class="dimk"  x1="109.1" y1="157" x2="127.6" y2="157" marker-end="url(#arr)" marker-start="url(#arrL)"/>
  <text class="dims" x="118.35" y="155.6">pitch 18.5</text>
  <!-- row 3: plate 131 -->
  <line class="dimln" x1="80.6"  y1="147" x2="80.6"  y2="163"/>
  <line class="dimln" x1="211.6" y1="147" x2="211.6" y2="163"/>
  <line class="dimk"  x1="80.6"  y1="162" x2="211.6" y2="162" marker-end="url(#arr)" marker-start="url(#arrL)"/>
  <text class="dims" x="146.1" y="160.6">plate 131</text>
  <!-- row 4: shell 184 -->
  <line class="dimln" x1="34"  y1="147" x2="34"  y2="169"/>
  <line class="dimln" x1="218" y1="147" x2="218" y2="169"/>
  <line class="dimln" x1="34"  y1="168" x2="218" y2="168" marker-end="url(#arrW)" marker-start="url(#arrWL)"/>
  <text class="dim" x="126" y="172.4">184 mm</text>

  <!-- Shell depth → right margin -->
  <line class="dimln" x1="219" y1="26"  x2="229" y2="26"/>
  <line class="dimln" x1="219" y1="146" x2="229" y2="146"/>
  <line class="dimln" x1="226" y1="26"  x2="226" y2="146" marker-end="url(#arrW)" marker-start="url(#arrWL)"/>
  <text class="dim" x="232.5" y="86" transform="rotate(90 232.5 86)">120 mm</text>

  <!-- ═══ NOTES ═══ -->
  <rect x="24" y="175" width="204" height="24" rx="2" fill="#fdf6bd" stroke="#d9c64a" stroke-width=".5"/>
  <text x="29" y="181" font-size="3.4" font-weight="700" fill="#6b5d00" letter-spacing=".3">NOTES — v1.0 · ONE-OCTAVE DEVICE</text>
  <text x="29" y="186.5" font-size="3.1" fill="#5c5208">12 KEYS C–B · UNIT 18 · PITCH 18.5 (CAP 18 + GAP 0.5) · PLATE 131 × 56.75 · SHELL 184 × 120 (WALLS 2.4 · 4 mm GRID)</text>
  <text x="29" y="191.5" font-size="3.1" fill="#5c5208">NO LEDs — DEFERRED TO PCB VERSION · 2-OCTAVE 24-KEY = FUTURE VERSION · SPEC: hardware/3d/keyboard/octaves-plan.md §8</text>
  <text x="29" y="196.5" font-size="3.1" fill="#5c5208">1 unit = 1 mm · grid 1 cm · pitch 18.5 off-grid · solid = top shell · orange dash = under plate · gray dash = bottom shell · "verify" = placeholder</text>

</svg>
